name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

# Per-app jobs (api tests against Postgres, spec freshness, web build,
# flutter analyze/test) are added in each app's scaffold PR.
jobs:
  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint
