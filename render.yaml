# Render Blueprint (ADR-0008, docs/DEPLOY.md). Render → New → Blueprint →
# this repo. Values marked `sync: false` are asked for once, on creation.
# Deploys follow `main`: merging a release deploys it.
#
#   gn-api    the app and the admin call this; /health, /openapi.json
#   gn-web    share pages, privacy policy, App Links
#   gn-admin  moderation dashboard
#
# Postgres is on Neon, not Render (ADR-0010): DATABASE_URL is asked for.
#
# Everything is on Render's free tier: services sleep after 15 minutes
# idle (the next request wakes them in about a minute). Moving up is a
# plan change per service in the dashboard (ADR-0008).

services:
  - type: web
    name: gn-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerContext: .
    dockerfilePath: apps/api/Dockerfile
    healthCheckPath: /health
    # Free instances have no pre-deploy step, so start.js migrates and
    # seeds (safe to repeat), then starts the API. One plain command:
    # Render doesn't strip quotes, so `sh -c "…"` can't be used here.
    dockerCommand: node dist/start.js
    envVars:
      # Neon's direct (not pooled) connection string, ?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3300'
      # https://<gn-web host>,https://<gn-admin host>
      - key: WEB_ORIGINS
        sync: false
      # https://<gn-web host>: share links point here
      - key: PUBLIC_WEB_URL
        sync: false
      - key: LAUNCH_CITY
        value: Addis Ababa
      # Home feed in the apps (ADR-0012). "true" to switch it on.
      - key: FEED_ENABLED
        value: 'false'
      - key: MIN_APP_VERSION
        value: 0.0.0
      - key: LATEST_APP_VERSION
        value: 1.0.0
      # Email: set one of these two (Resend wins if both are set)
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        value: gn-media
      - key: MEDIA_PUBLIC_URL
        sync: false

  - type: web
    name: gn-web
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerContext: .
    dockerfilePath: apps/web/Dockerfile
    envVars:
      - key: PORT
        value: '3000'
      # Free services can't be reached privately: the API's public URL,
      # https://gn-api.onrender.com
      - key: API_URL
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      - key: ANDROID_PACKAGE
        value: com.example.rally
      - key: ANDROID_CERT_SHA256
        sync: false
      - key: PLAY_STORE_URL
        sync: false
      - key: CONTACT_EMAIL
        sync: false

  - type: web
    name: gn-admin
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerContext: .
    dockerfilePath: apps/admin/Dockerfile
    envVars:
      - key: PORT
        value: '3001'
      # Free services can't be reached privately: the API's public URL,
      # https://gn-api.onrender.com
      - key: API_URL
        sync: false
