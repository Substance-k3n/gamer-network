# Render Blueprint (ADR-0008, docs/DEPLOY.md). Render → New → Blueprint →
# this repo. Values marked `sync: false` are asked for once, on creation.
# Deploys follow `main`: merging a release deploys it.
#
#   gn-api    the apps call this; /health, /openapi.json
#
# The web app and the admin run on Cloudflare Workers (ADR-0014,
# docs/DEPLOY.md §4).
#
# Postgres is on Neon, not Render (ADR-0010): DATABASE_URL is asked for.
#
# Render's free tier: the API sleeps after 15 minutes idle (the next
# request wakes it in about a minute), so a cron pings /health every 10
# minutes. Moving up is a plan change in the dashboard (ADR-0008).

services:
  - type: web
    name: gn-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerContext: .
    dockerfilePath: apps/api/Dockerfile
    healthCheckPath: /health
    # Free instances have no pre-deploy step, so start.js migrates and
    # seeds (safe to repeat), then starts the API. One plain command:
    # Render doesn't strip quotes, so `sh -c "…"` can't be used here.
    dockerCommand: node dist/start.js
    envVars:
      # Neon's direct (not pooled) connection string, ?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3300'
      # https://gn-web.rally-et.workers.dev (the admin calls the API from its
      # Worker, so it doesn't need to be here)
      - key: WEB_ORIGINS
        sync: false
      # https://gn-web.rally-et.workers.dev: share links point here
      - key: PUBLIC_WEB_URL
        sync: false
      - key: LAUNCH_CITY
        value: Addis Ababa
      # The admin's sign-in, made or updated on every start (db/seed.ts).
      # Changing the password and redeploying resets it.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Home feed and Groups in the apps (ADR-0012). "false" to switch either off.
      - key: FEED_ENABLED
        value: 'true'
      - key: GROUPS_ENABLED
        value: 'true'
      - key: MIN_APP_VERSION
        value: 0.0.0
      - key: LATEST_APP_VERSION
        value: 1.0.0
      # Email: set one of these two (Resend wins if both are set)
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        value: gn-media
      - key: MEDIA_PUBLIC_URL
        sync: false
